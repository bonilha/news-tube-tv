{% if not htmx %}{% extends "base.html" %}{% endif %}
{% block content %}
<h1 class="mb-2">YouTube Channels</h1>

<div class="card mb-3">
    <h3 class="mb-1">Add Channel</h3>
    <form hx-post="/channels/add" hx-target="#channels-table" hx-swap="innerHTML"
          class="flex gap-1" style="align-items:end; flex-wrap:wrap;">
        <div style="flex:2; min-width:200px;">
            <label class="text-sm text-muted" for="channel-url">Handle or URL</label>
            <input type="text" id="channel-url" name="channel_url" placeholder="@canal ou URL do YouTube"
                   style="width:100%; padding:0.5rem; border-radius:0.375rem; border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-color); margin-top:0.25rem;" required>
        </div>
        <div style="flex:0 1 120px; min-width:100px;">
            <label class="text-sm text-muted" for="min-age">Idade mín. (h)</label>
            <input type="number" id="min-age" name="min_age_hours" value="2" min="0" step="0.5"
                   style="width:100%; padding:0.5rem; border-radius:0.375rem; border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-color); margin-top:0.25rem;">
        </div>
        <button type="submit" class="btn btn-primary" style="height:38px;">Add</button>
    </form>
</div>

<div id="channels-table">
    {% include "partials/channel_table.html" %}
</div>
{% endblock %}
