<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsTube TV</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --sidebar-color: #111827;
            --card-bg: #1f2937;
            --card-bg-subtle: #172033;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #374151;
            --border-subtle: #1e293b;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --success-color: #10b981;
            --success-hover: #059669;
            --warning-color: #f59e0b;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        aside {
            width: 250px;
            min-width: 250px;
            background-color: var(--sidebar-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1.5rem 1rem;
            user-select: none;
        }
        .brand {
            margin-bottom: 2rem;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .brand-badge {
            background: linear-gradient(135deg, var(--accent-color), #8b5cf6);
            color: #fff;
            padding: 0.2rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 800;
        }
        .nav-item {
            padding: 0.65rem 0.85rem;
            margin-bottom: 0.35rem;
            border-radius: var(--radius-md);
            transition: all 0.15s ease-in-out;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .nav-item:hover {
            background: var(--card-bg);
            color: var(--text-color);
            transform: translateX(2px);
        }
        .nav-item.active {
            background: var(--accent-color);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        main {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            min-width: 0;
        }
        h1, h2, h3 { margin-top: 0; font-weight: 600; letter-spacing: -0.015em; }
        h1 { font-size: 1.6rem; }
        h2 { font-size: 1.25rem; }
        h3 { font-size: 1.05rem; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            line-height: 1.25;
            transition: all 0.15s ease-in-out;
            text-decoration: none;
            user-select: none;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled, .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        .btn-primary { background: var(--accent-color); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
        .btn-danger { background: var(--danger-color); color: #fff; }
        .btn-danger:hover:not(:disabled) { background: var(--danger-hover); }
        .btn-success { background: var(--success-color); color: #fff; }
        .btn-success:hover:not(:disabled) { background: var(--success-hover); }
        .btn-ghost { background: var(--card-bg-subtle); color: var(--text-color); border: 1px solid var(--border-color); }
        .btn-ghost:hover:not(:disabled) { background: var(--border-color); color: #fff; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            box-shadow: var(--shadow-sm);
        }
        .grid { display: grid; gap: 1rem; }
        .grid-2 { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th, td { text-align: left; padding: 0.75rem 0.85rem; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-weight: 500; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; background: rgba(0,0,0,0.1); }
        td { font-size: 0.875rem; vertical-align: middle; }
        tr:hover td { background-color: rgba(255, 255, 255, 0.02); }
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            line-height: 1;
        }
        .status-on { background: var(--success-color); color: #fff; }
        .status-off { background: #475569; color: #cbd5e1; }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .flex { display: flex; }
        .flex-between { justify-content: space-between; }
        .flex-center { align-items: center; }
        .gap-1 { gap: 0.5rem; }
        .gap-2 { gap: 1rem; }
        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }
        .mb-3 { margin-bottom: 1.5rem; }
        .text-muted { color: var(--text-muted); }
        .text-sm { font-size: 0.8125rem; }

        /* HTMX Loading States */
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-flex; }
        .htmx-request.btn, .btn.htmx-request { opacity: 0.7; pointer-events: none; }
        .spinner {
            display: inline-block;
            width: 1em;
            height: 1em;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Upload drop zone */
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            background: rgba(255, 255, 255, 0.01);
        }
        .drop-zone:hover { border-color: var(--accent-color); background: rgba(59, 130, 246, 0.04); }

        /* Mobile */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside {
                width: 100%;
                min-width: 0;
                flex-direction: row;
                padding: 0.75rem 1rem;
                gap: 0.25rem;
                overflow-x: auto;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .brand { display: none; }
            .nav-item { white-space: nowrap; padding: 0.5rem 0.75rem; font-size: 0.8125rem; }
            main { padding: 1rem; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="cookie-alert" hidden role="alert" style="display:none; position:fixed; top:0; left:0; right:0; z-index:80; padding:0.875rem 1.25rem; background:#7f1d1d; color:#fff; border-bottom:3px solid #ef4444; font-size:0.95rem;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
            <div>
                <strong>Aviso: Cookies do YouTube inválidos.</strong>
                <span id="cookie-alert-text"></span>
            </div>
            <button id="cookie-alert-mute" class="btn btn-ghost" style="color:#fff; border-color:rgba(255,255,255,0.4); padding:0.25rem 0.6rem; font-size:0.75rem;">
                Silenciar alarme sonoro
            </button>
        </div>
    </div>
    <aside>
        <div class="brand">
            <span>NewsTube</span>
            <span class="brand-badge">TV</span>
        </div>
        <a href="/" class="nav-item{% if request.url.path == '/' %} active{% endif %}" id="nav-dashboard"
           hx-get="/" hx-target="#content" hx-push-url="true">
            <span>Painel</span>
        </a>
        <a href="/scenes" class="nav-item{% if request.url.path == '/scenes' %} active{% endif %}" id="nav-scenes"
           hx-get="/scenes" hx-target="#content" hx-push-url="true">
            <span>Cenas</span>
        </a>
        <a href="/assets" class="nav-item{% if request.url.path == '/assets' %} active{% endif %}" id="nav-assets"
           hx-get="/assets" hx-target="#content" hx-push-url="true">
            <span>Assets</span>
        </a>
        <a href="/channels" class="nav-item{% if request.url.path == '/channels' %} active{% endif %}" id="nav-channels"
           hx-get="/channels" hx-target="#content" hx-push-url="true">
            <span>Canais</span>
        </a>
        <a href="/queue" class="nav-item{% if request.url.path == '/queue' %} active{% endif %}" id="nav-queue"
           hx-get="/queue" hx-target="#content" hx-push-url="true">
            <span>Fila</span>
        </a>
        <a href="/configs" class="nav-item{% if request.url.path == '/configs' %} active{% endif %}" id="nav-configs"
           hx-get="/configs" hx-target="#content" hx-push-url="true">
            <span>Configurações</span>
        </a>
    </aside>
    <main id="content">
        {% block content %}{% endblock %}
    </main>
    <script>
    window._pageCleanups = window._pageCleanups || [];
    function registerCleanup(fn) {
        window._pageCleanups.push(fn);
    }
    function runCleanups() {
        while (window._pageCleanups.length > 0) {
            var fn = window._pageCleanups.pop();
            try { fn(); } catch (e) {}
        }
    }
    document.body.addEventListener("htmx:beforeSwap", function () {
        runCleanups();
    });

    document.body.addEventListener("htmx:configRequest", function (evt) {
        evt.detail.credentials = "include";
    });
    function markNav(path) {
        document.querySelectorAll("a.nav-item").forEach(function (link) {
            var href = link.getAttribute("href");
            var isActive = (path === "/" && href === "/") || (href !== "/" && path.startsWith(href));
            link.classList.toggle("active", isActive);
        });
    }
    document.body.addEventListener("click", function (evt) {
        var link = evt.target.closest && evt.target.closest("a.nav-item");
        if (!link) return;
        markNav(link.getAttribute("href"));
    });
    document.body.addEventListener("htmx:pushedIntoHistory", function () {
        markNav(location.pathname);
    });

    // Alerta sonoro de cookies
    (function () {
        var box = document.getElementById("cookie-alert");
        var text = document.getElementById("cookie-alert-text");
        var muteBtn = document.getElementById("cookie-alert-mute");
        var ctx = null;
        var timer = null;
        var running = false;
        var muted = false;

        if (muteBtn) {
            muteBtn.addEventListener("click", function () {
                muted = true;
                stopAlarm();
                muteBtn.textContent = "Alarme silenciado";
                muteBtn.disabled = true;
            });
        }

        function beep() {
            if (muted) return;
            if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === "suspended") ctx.resume();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = "square";
            osc.frequency.value = 880;
            gain.gain.value = 0.08;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
        }
        function startAlarm() {
            if (running || muted) return;
            running = true;
            beep();
            timer = setInterval(beep, 1500); // Espaçamento maior e menos irritante
        }
        function stopAlarm() {
            running = false;
            if (timer) clearInterval(timer);
            timer = null;
        }
        document.addEventListener("pointerdown", function () {
            if (running && !muted) beep();
        }, { once: true });
        function apply(data) {
            if (data && data.ok) {
                box.hidden = true;
                box.style.display = "none";
                stopAlarm();
                muted = false;
                if (muteBtn) {
                    muteBtn.textContent = "Silenciar alarme sonoro";
                    muteBtn.disabled = false;
                }
                return;
            }
            text.textContent = " " + ((data && data.message) || "Os vídeos não serão baixados.");
            box.hidden = false;
            box.style.display = "block";
            startAlarm();
        }
        function poll() {
            fetch("/api/queue/cookies", { headers: { "Accept": "application/json" } })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (data) { if (data) apply(data); })
                .catch(function () {});
        }
        poll();
        setInterval(poll, 30000);
    })();
    </script>
</body>
</html>
