<div class="grid grid-2">
    {% for scene in scenes %}
    <div class="card" {% if scene.active %}style="border-color: var(--accent-color)"{% endif %}>
        <div class="flex flex-between flex-center mb-1">
            <h3 style="margin:0">{{ scene.name }}</h3>
            {% if scene.active %}
                <span class="status-badge status-on">ACTIVE</span>
            {% endif %}
        </div>
        <p class="text-muted text-sm mb-2">{{ scene.description or 'No description' }}</p>
        <div class="flex gap-1">
            <button class="btn btn-primary"
                    hx-post="/api/scenes/{{ scene.name | urlencode }}/switch" hx-swap="none"
                    hx-on:after-request="setTimeout(()=>document.getElementById('status-poll').click(),300)">
                Switch
            </button>
            <a href="/editor/scene/{{ scene.name | urlencode }}" class="btn btn-ghost"
               hx-get="/editor/scene/{{ scene.name | urlencode }}" hx-target="#content" hx-push-url="true">
                Edit
            </a>
        </div>
    </div>
    {% endfor %}
</div>
